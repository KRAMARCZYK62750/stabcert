name: release

# Publishes to PyPI when a tag vX.Y.Z is pushed. No token is stored anywhere:
# PyPI trusts this workflow directly (trusted publishing, OIDC). The PyPI side
# is configured once, under the project's "Publishing" settings, with this
# repository, this file name and the environment name "pypi".

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml would publish under a version
      # nobody asked for, and a PyPI version can never be uploaded twice.
      - name: tag matches the declared version
        run: |
          declared=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${declared}" = "${GITHUB_REF_NAME}"

      - name: build sdist and wheel
        run: |
          python -m pip install --quiet --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      # The wheel is what a reader installs: run the suite against it, outside
      # the checkout, so a module missing from the package fails here.
      - name: suite against the built wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install --quiet dist/*.whl 'pytest>=7'
          mkdir /tmp/wheel-run && cp -r tests schemas /tmp/wheel-run/
          cd /tmp/wheel-run && /tmp/wheel-env/bin/python -m pytest -q tests/test_logical_signature_width.py tests/test_channel_certified_mode.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
