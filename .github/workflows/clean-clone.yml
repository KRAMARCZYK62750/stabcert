name: clean clone

# Runs the suite against tracked content only. A checkout contains exactly what
# a reader gets by cloning, so a test reading an untracked artifact fails here
# and passes locally -- which is the failure this job exists to catch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported version and a current one. requires-python is >=3.10,
        # so the lower bound is a claim the project makes and should be tested.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Core dependencies only: numpy and stim. The SABRE and pytket modules
      # skip themselves when their backend is absent, so this run proves the
      # suite is green without any optional compiler installed.
      - name: install core
        run: python -m pip install --quiet --upgrade pip && python -m pip install --quiet -e '.[test]'

      - name: suite without optional backends
        run: python -m pytest -q

      # Full install: the count quoted in the documentation is the one obtained
      # with every backend present.
      - name: install optional backends
        run: python -m pip install --quiet -e '.[test,sabre,pytket]'

      - name: suite with every backend
        # Without pipefail the pipeline reports tee's status, so a failing suite
        # would be masked here and only surface at the count check below.
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q | tee pytest-full.txt

      # Check the documented counts against the run that just happened here,
      # not against results/test_suite_count.json -- that file records a
      # contributor's local run, which is precisely the thing this job does not
      # trust. --report reuses the output above instead of running a third time.
      - name: documented test counts match this run
        run: python sync_test_counts.py --report pytest-full.txt --check

      # The paper's figures are recomputed from the tracked artifacts. Without
      # this, regenerating a campaign would silently move a figure away from
      # the text that quotes it -- and a checkout is the only place where an
      # untracked artifact shows up as missing.
      - name: paper review pass 1 -- form
        run: python check_paper_consistency.py

      - name: paper review pass 2 -- figures against artifacts
        run: python verify_paper_figures.py

  # Separate job: the TeX install costs about a minute and has no reason to run
  # once per Python version. This is the first step in the project that actually
  # typesets the paper -- until now the generator emitted LaTeX it had never
  # seen compiled, and every defect was found by a human running pdflatex by
  # hand and reporting back.
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended

      # Regenerated rather than taken from the checkout: the point is to catch a
      # generator that starts emitting uncompilable LaTeX, and compiling the
      # committed .tex would pass while the generator was already broken.
      - name: regenerate from the markdown source
        run: python build_paper_tex.py

      - name: committed .tex matches the generator
        run: git diff --exit-code -- docs/paper/stabcert.tex

      - name: typeset
        working-directory: docs/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error stabcert.tex
          bibtex stabcert
          pdflatex -interaction=nonstopmode -halt-on-error stabcert.tex
          pdflatex -interaction=nonstopmode -halt-on-error stabcert.tex

      # Undefined citations and references do not stop pdflatex: they typeset as
      # [?] and the build reports success. They have to be looked for.
      - name: no undefined citations or references
        working-directory: docs/paper
        shell: bash
        run: |
          undefined=$(grep -c 'undefined' stabcert.log || true)
          if [ "$undefined" -ne 0 ]; then
            grep -n 'undefined' stabcert.log
            echo "::error::$undefined undefined citation(s) or reference(s)"
            exit 1
          fi

      # A recorded budget rather than a bare check: an overfull box is a
      # measurement, and the number belongs in a file where changing it is a
      # visible decision. grep -c exits 1 on no match, so its status is caught
      # here rather than being allowed to fail the step for the good outcome.
      - name: overfull boxes within budget
        working-directory: docs/paper
        shell: bash
        run: |
          budget=$(grep -m1 -o '^[0-9]\+' overfull_budget.txt)
          count=$(grep -c 'Overfull' stabcert.log || true)
          echo "overfull boxes: $count, budget: $budget"
          if [ "$count" -gt "$budget" ]; then
            grep -n 'Overfull' stabcert.log
            echo "::error::$count overfull boxes against a budget of $budget"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stabcert-pdf
          path: docs/paper/stabcert.pdf
