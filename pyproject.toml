[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stabcert"
version = "0.1.0"
description = "Sound and complete translation validation for stabilizer channels"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Frédéric Kramarczyk", email = "fkra62@gmail.com" }]
keywords = ["quantum", "stabilizer", "verification", "compilation", "clifford"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "stim>=1.13"]

[project.urls]
Repository = "https://github.com/KRAMARCZYK62750/stabcert"

[project.optional-dependencies]
test = ["pytest>=7"]
sabre = ["qiskit>=2.1,<3"]
pytket = ["pytket>=2.18,<3"]

[project.scripts]
stabcert = "hayden_preskill_toy.recovery_cli:main"

[tool.setuptools]
packages = ["hayden_preskill_toy"]

[tool.setuptools.data-files]
"share/stabcert/schemas" = [
  "schemas/recovery_problem.schema.json",
  "schemas/recovery_artifact.schema.json",
  "schemas/recovery_run_report.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]